# Monthly and grouped, into dev (never straight into main). Major versions of the framework packages are left alone: the
# phone apps move between Expo SDKs on purpose, with `npx expo install expo@^NN.0.0` and `npx expo install --fix`, not one
# package at a time. ESLint 10 is ignored until its plugins support it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /apps/admin-dashboard
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-scripts"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/driver-app
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react-native"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/passenger-app
    target-branch: dev
    open-pull-requests-limit: 3
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react-native"
        update-types: ["version-update:semver-major"]
