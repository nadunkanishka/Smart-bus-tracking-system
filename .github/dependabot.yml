# Monthly, grouped, so dependency updates arrive as a few pull requests instead of dozens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /apps/admin-dashboard
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /apps/driver-app
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /apps/passenger-app
    schedule: { interval: monthly }
    groups: { all: { update-types: [minor, patch] } }
