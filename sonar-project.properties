# SonarCloud (automatic analysis) settings.
# The apps hold generated copies of shared/ (written by shared/sync.js, checked by CI "shared-sync"). The original is analysed
# once; the copies would only be counted again as duplicated code and repeated issues.
sonar.exclusions=apps/*/src/shared/**,apps/admin-dashboard/src/design/**,backend/lib/contract.js,**/dist/**,**/build/**
sonar.cpd.exclusions=apps/*/src/shared/**,apps/admin-dashboard/src/design/**,backend/lib/contract.js
