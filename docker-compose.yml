# Local stack: API + MongoDB + Redis.   docker compose up --build
# Only Redis and MongoDB (run the API with `npm run dev`):   docker compose up mongo redis
services:
  mongo:
    image: mongo:7
    ports: ["27018:27017"]   # 27018 on the host so it does not clash with a locally installed MongoDB
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/smart_bus_tracking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on: [mongo, redis]

volumes:
  mongo-data:
